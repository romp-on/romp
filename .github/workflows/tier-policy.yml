name: Tier policy

# The PR tier POLICY (the repository owner's rules of 2026-09-08, by tier and by the author's role),
# enforced as a required status check. Roles are the author's collaborator permission: admin is the
# repository owner, write or maintain a member, anyone else a contributor. docs and fix are one tier and
# merge on green for every author (the check requires no approval). feature merges on green when the
# author is an admin; by anyone else it needs an approval by an admin other than the author on the
# current head. major-feature needs a discussion in a linked issue for every author, plus that admin
# approval when the author is not an admin. Anything touching .github/ or scripts/ci/ needs an admin's
# approval regardless of tier unless the author is an admin. A standing change request by a maintainer
# other than the author holds a PR of any tier until that reviewer lifts it. No tier has a time-based
# path. Rulesets cannot vary by label, so the policy is this check. The RULES are a pure function
# (scripts/ci/tier_policy.py, pinned by tests/test_tier_policy.py); this workflow only fetches PR data
# through the API and posts the verdict as a check run named "Tier policy" on the PR's head sha.
#
# TRUST MODEL, verified against the GitHub docs:
# - pull_request_target runs THIS file from the base repository's default branch, never the PR's copy,
#   so a PR cannot rewrite its own gate; the job never checks out or executes PR code (API reads only).
# - pull_request_review runs in the PR's merge-commit context, so it is deliberately NOT a trigger:
#   approvals propagate through the hourly schedule (or a manual dispatch), never through a job whose
#   file the PR controls.
# - The token holds checks:write (to post the verdict), pull-requests:read, issues:read, contents:read
#   and nothing else. GITHUB_TOKEN is the GitHub Actions app's installation token, which is what the
#   Checks API's "GitHub Apps only" write rule admits; the ruleset requiring this check must select the
#   run posted by the GitHub Actions app.
# - Nothing in the policy is timed: the fetcher reads no check-run history, no timeline and no commit
#   date, so there is no clock for a forged date, a reopen or a sibling PR's head to feed.
# - The job below is named "Tier policy evaluation", NOT "Tier policy": the required check is the
#   API-posted verdict alone. Were the job named the same, every head would carry two same-named runs
#   (the job's, frozen at push time, and the verdict the hourly sweep moves) and which one the ruleset
#   honors is undocumented.
# - RESIDUAL, stated as open: a PR can add a pull_request-triggered workflow whose JOB is named
#   "Tier policy"; GitHub Actions creates that run on the head with no token, under the same app and
#   sha as the base verdict, and the merge box follows the newest same-named run - app selection
#   cannot tell them apart. The policy requires an admin's approval for ANY PR touching .github/ or
#   scripts/ci/ whose author is not an admin (a human looks), but that rule rides the check the forged
#   run competes with; what closes it is a CODEOWNERS entry for those paths with code-owner review
#   required in the ruleset.
#
# A PR opened a moment ago may not carry its tier label yet: `gh pr create --label` fires `opened`
# before the label lands, so a run that reads at once posts a failure on a PR sorted a second later
# (the label check races the same way, and failed eighteen PRs that way on 2026-09-08, one per PR
# opened). The step hands the fetcher the event's ACTION: on opened and reopened, and only those, a PR
# with no tier label is re-read every five seconds for up to a minute before it is judged
# (wait_for_tier_label in scripts/ci/tier_policy_check.py; TIER_GRACE_STEP_SECS / TIER_GRACE_TRIES let
# a test run the wait in no time). A PR that stays unlabelled still fails, a minute later; two labels,
# every other event, the hourly sweep and a dispatch judge at once. Until the verdict posts the PR
# shows a pending check, never a red one. The pause is not a clock: nothing in the policy is timed.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
  schedule:
    - cron: "17 * * * *"          # hourly: approval propagation
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to re-evaluate (empty = every open PR)"
        required: false
        default: ""

permissions:
  checks: write
  pull-requests: read
  issues: read
  contents: read

jobs:
  policy:
    name: Tier policy evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4          # the BASE branch's tree (pull_request_target / schedule / dispatch)
      - name: Evaluate and post the verdict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 scripts/ci/tier_policy_check.py --pr "$PR_NUMBER"
          else
            python3 scripts/ci/tier_policy_check.py --all-open
          fi
